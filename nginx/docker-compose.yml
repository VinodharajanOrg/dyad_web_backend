version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: dyad-nginx-proxy
    ports:
      - "80:80"
      # - "443:443"  # Uncomment for HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
      # - ./ssl:/etc/nginx/ssl:ro  # Uncomment for HTTPS with SSL certificates
    networks:
      - dyad-network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dyad-backend
    env_file:
      - ../.env
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
      - "3443:3443"  # HTTPS port
      # Container preview ports (32100-32200) are managed by Docker-in-Docker, not exposed here
    environment:
      # Server Configuration
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3001}
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-0}
      # SSL Configuration
      - USE_HTTPS=${USE_HTTPS:-true}
      - SSL_KEY_PATH=/app/ssl/key.pem
      - SSL_CERT_PATH=/app/ssl/cert.pem
      
      # Database
      - DATABASE_URL=${DATABASE_URL}
      
      # Rate Limiting
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-500}
      
      # File Size Limits
      - DEFAULT_LIMIT=${DEFAULT_LIMIT:-10mb}
      - ATTACHMENT_SIZE_LIMIT_MB=${ATTACHMENT_SIZE_LIMIT_MB:-50mb}
      
      # Directories
      - DATA_DIR=/app/data
      - APPS_BASE_DIR=${APPS_BASE_DIR:-/app/apps}
      - HOST_APPS_BASE_DIR=${HOST_APPS_BASE_DIR}
      
      # Containerization
      - CONTAINERIZATION_ENABLED=${CONTAINERIZATION_ENABLED:-true}
      - CONTAINERIZATION_ENGINE=${CONTAINERIZATION_ENGINE:-docker}
      - AUTO_KILL_PORT=${AUTO_KILL_PORT:-true}
      - DEFAULT_PACKAGE_MANAGER=${DEFAULT_PACKAGE_MANAGER:-pnpm}
      - CONTAINER_INACTIVITY_TIMEOUT=${CONTAINER_INACTIVITY_TIMEOUT:-1600000}
      - CONTAINER_CPU_LIMIT=${CONTAINER_CPU_LIMIT:-4}
      - CONTAINER_MEMORY_LIMIT=${CONTAINER_MEMORY_LIMIT:-1g}
      
      # Docker Configuration
      - DOCKER_SOCKET=${DOCKER_SOCKET:-/var/run/docker.sock}
      - DOCKER_IMAGE=${DOCKER_IMAGE:-dyad-vite-dev:latest}
      - DOCKER_DEFAULT_PORT=${DOCKER_DEFAULT_PORT:-32100}
      
      # Podman Configuration
      - PODMAN_SOCKET=${PODMAN_SOCKET}
      - PODMAN_IMAGE=${PODMAN_IMAGE:-node:22-alpine}
      - PODMAN_DEFAULT_PORT=${PODMAN_DEFAULT_PORT:-32100}
      
      # Auth Configuration
      - AUTH_PROVIDER=${AUTH_PROVIDER:-keycloak}
      - AUTH_ISSUER_URL=${AUTH_ISSUER_URL}
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID}
      - AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET}
      - AUTH_REDIRECT_URI=${AUTH_REDIRECT_URI}
      - AUTH_LOGOUT_ENDPOINT=${AUTH_LOGOUT_ENDPOINT}
      - AUTH_TOKEN_ENDPOINT=${AUTH_TOKEN_ENDPOINT}
      - AUTH_USERINFO_ENDPOINT=${AUTH_USERINFO_ENDPOINT}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-console}
      - LOG_HTTP_ENDPOINT=${LOG_HTTP_ENDPOINT}
      - LOG_HTTP_AUTH=${LOG_HTTP_AUTH}
      
      # AI Configuration
      - DEFAULT_AI_MODEL=${DEFAULT_AI_MODEL:-anthropic:claude-sonnet-4-5}
      - FALLBACK_AI_MODEL=${FALLBACK_AI_MODEL:-openai:gpt-4o}
      - DEFAULT_CHAT_MODE=${DEFAULT_CHAT_MODE:-auto-code}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - AZURE_FOUNDRY_API_KEY=${AZURE_FOUNDRY_API_KEY}
      - CUSTOM_API_ENDPOINT=${CUSTOM_API_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}
    volumes:
      - ../data:/app/data
      - ../apps:/app/apps  # Mount apps directory for container access
      - ../ssl:/app/ssl:ro  # Mount SSL certificates for HTTPS
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker-in-Docker
    networks:
      - dyad-network
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allow connection to host PostgreSQL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--tries=1", "--spider", "https://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  dyad-network:
    driver: bridge
