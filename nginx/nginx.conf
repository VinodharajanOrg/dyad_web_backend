# Unified Nginx Configuration for Dyad Frontend and Backend
# This configuration provides reverse proxy for both the Next.js frontend and Express backend
# with unified SSL certificate management

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/javascript application/xml+rss 
               application/json application/xml application/rss+xml 
               font/truetype font/opentype application/vnd.ms-fontobject 
               image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=preview_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;

    # Upstream backend server
    upstream backend_api {
        server backend:3001;
        keepalive 32;
    }

    # Upstream frontend server
    upstream frontend_app {
        server frontend:3000;
        keepalive 32;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name 10.157.150.207 localhost _;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check endpoint - no redirect
        location /health {
            access_log off;
            return 200 '{"status":"ok","frontend":"healthy","backend":"healthy"}\n';
            add_header Content-Type application/json;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server - Main configuration
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name 10.157.150.207 localhost _;

        # SSL certificate paths (common SSL directory)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Force X-Forwarded-Proto to https for SSL-terminating load balancers
        set $forwarded_proto $scheme;
        if ($http_x_forwarded_proto) {
            set $forwarded_proto $http_x_forwarded_proto;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{"status":"ok","frontend":"healthy","backend":"healthy"}\n';
            add_header Content-Type application/json;
        }

        # Backend API Documentation
        location /api-docs {
            proxy_pass http://backend_api/api-docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Backend API endpoints
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Handle redirects properly
            proxy_redirect off;
            proxy_intercept_errors off;

            # Timeouts for SSE streaming
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
        }

        # Direct proxy to app containers by port
        # Example: https://10.157.150.207/container/32100/ -> http://dyad-app-3:32100/
        # Note: App containers must be on dyad-network (automatically handled by backend)
        location ~ ^/container/(?<port>[0-9]+)(/.*)?$ {
            limit_req zone=preview_limit burst=50 nodelay;

            # Construct container name from port (dyad-app-X where X is app ID)
            # For now, we'll use host.docker.internal with the port
            set $container_port $port;
            
            # Rewrite to remove /container/PORT prefix
            rewrite ^/container/[0-9]+(/.*)?$ $1 break;

            # Proxy to the container port on host (most reliable method)
            proxy_pass http://host.docker.internal:$container_port;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Pass original host to avoid Vite's 403 check
            proxy_set_header Host $http_host;
            proxy_set_header Origin http://host.docker.internal:$container_port;
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Original-URI $request_uri;

            # WebSocket support for Vite HMR
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            
            # Disable buffering for real-time updates
            proxy_buffering off;
            proxy_cache off;
            
            # CORS headers for Vite dev server
            add_header Access-Control-Allow-Origin * always;
        }

        # Container preview endpoints (backend API)
        location ~ ^/app/preview/(?<app_id>[0-9]+)(/.*)?$ {
            limit_req zone=preview_limit burst=50 nodelay;

            proxy_pass http://backend_api/app/preview/$app_id$2;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Original-URI $request_uri;

            # WebSocket support for HMR
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            
            # Disable buffering for real-time updates
            proxy_buffering off;
            proxy_cache off;
            
            # Handle errors gracefully
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # Static file serving for container assets
        location ~ ^/app/preview/(?<app_id>[0-9]+)/assets/ {
            proxy_pass http://backend_api/app/preview/$app_id/assets/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            
            # Cache static assets
            proxy_cache_valid 200 1h;
            proxy_cache_bypass $http_pragma $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Next.js static files optimization
        location /_next/static {
            proxy_pass http://frontend_app;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, immutable";
        }

        # Next.js image optimization
        location /_next/image {
            proxy_pass http://frontend_app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Frontend application (default route)
        location / {
            limit_req zone=general_limit burst=100 nodelay;

            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_cache_bypass $http_upgrade;
           
            # WebSocket support
            proxy_read_timeout 86400;
        }

        # Error pages
        error_page 404 /404.html;
        location = /404.html {
            return 404 '{"error":"Not found","path":"$uri"}';
            add_header Content-Type application/json;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            return 500 '{"error":"Internal server error","message":"The service is temporarily unavailable"}';
            add_header Content-Type application/json;
        }
    }
}
