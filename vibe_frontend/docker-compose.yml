services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set your backend API URL here
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    ports:
    - "0.0.0.0:3000:3000"
    env_file:
      - env.local
    expose:
      - "3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      - NODE_TLS_REJECT_UNAUTHORIZED=1
    restart: unless-stopped
    networks:
      - dyad-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
 
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dyad-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
 
  # Optional: Certbot for Let's Encrypt certificates
  # Uncomment this service if you want to use Let's Encrypt
  # certbot:
  #   image: certbot/certbot:latest
  #   volumes:
  #     - certbot-www:/var/www/certbot:rw
  #     - certbot-conf:/etc/letsencrypt:rw
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  #   networks:
  #     - dyad-network
 
volumes:
  certbot-www:
  certbot-conf:
 
networks:
  dyad-network:
    driver: bridge