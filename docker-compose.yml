# Unified Docker Compose for Vibe Frontend, Backend, and Nginx
# This configuration runs all services together with a common SSL directory
# Environment variables are loaded from individual service .env files

services:
  # Backend API Service
  backend:
    build:
      context: ./vibe_backend
      dockerfile: Dockerfile
    container_name: vibe-backend
    env_file:
      - ./vibe_backend/.env
    ports:
      - "3001:3001"
      - "3443:3443"
    volumes:
      # Mount common SSL directory
      - ./ssl:/app/ssl:ro
      # Mount data and apps directories
      - ./vibe_backend/data:/app/data
      - ./vibe_backend/apps:/app/apps
      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dyad-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service (Next.js)
  frontend:
    build:
      context: ./vibe_frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost/api}
    container_name: vibe-frontend
    env_file:
      - ./vibe_frontend/env.local
    ports:
      - "0.0.0.0:3000:3000"
    expose:
      - "3000"
    volumes:
      # Mount common SSL directory (if frontend needs it)
      - ./ssl:/app/ssl:ro
    networks:
      - dyad-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Unified Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: dyad-nginx
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      # Nginx configuration
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      
      # Common SSL directory (shared by all services)
      - ./ssl:/etc/nginx/ssl:ro
      
      # Logs directory
      - ./logs/nginx:/var/log/nginx
      
      # Certbot directories (for Let's Encrypt)
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    networks:
      - dyad-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Certbot for Let's Encrypt certificates
  # Uncomment this service if you want to use Let's Encrypt for production SSL certificates
  # certbot:
  #   image: certbot/certbot:latest
  #   container_name: dyad-certbot
  #   volumes:
  #     - certbot-www:/var/www/certbot:rw
  #     - certbot-conf:/etc/letsencrypt:rw
  #     - ./ssl:/etc/ssl/dyad:rw
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  #   networks:
  #     - dyad-network

volumes:
  certbot-www:
  certbot-conf:

networks:
  dyad-network:
    driver: bridge
    name: dyad-network
