services:
  db:
    image: quay.io/enterprisedb/postgresql:16
    container_name: dyad_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dyad
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    networks:
      - keycloak-network

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      DB_VENDOR: POSTGRES
      DB_ADDR: db
      DB_DATABASE: dyad
      DB_USER: user
      DB_PASSWORD: postgres
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY: "edge"
      KC_HOSTNAME: "10.157.150.207"
      KC_HOSTNAME_PORT: "8080"

    expose:
      - "8080"
    networks:
      - keycloak-network
    depends_on:
      - db
    command: ["start-dev", "--http-enabled=true", "--hostname-strict=false", "--hostname-strict-https=false", "--proxy=edge"]

networks:
  keycloak-network:
    driver: bridge
